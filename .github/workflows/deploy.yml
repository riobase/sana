name: Build and Deploy Sana Flutter Web
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sana-pages-deploy-v2
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Setup Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Build Flutter Web
        run: |
          flutter pub get
          flutter build web --release --base-href /sana/

      - name: Verify generated GitHub Pages build
        shell: bash
        run: |
          test -s build/web/index.html
          test -s build/web/flutter_bootstrap.js
          test -s build/web/main.dart.js
          grep -Fq '<base href="/sana/">' build/web/index.html
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const html = readFileSync('build/web/index.html', 'utf8');
          const manifest = JSON.parse(readFileSync('build/web/manifest.json', 'utf8'));
          if (!html.includes('<title>Sana</title>') || !html.includes('<base href="/sana/">')) {
            throw new Error('Flutter web HTML is not configured for https://riobase.github.io/sana/');
          }
          if (manifest.name !== 'Sana' || manifest.short_name !== 'Sana') {
            throw new Error('Sana web manifest branding is incorrect');
          }
          console.log('Sana Pages build verified: /sana/ base path, entrypoint, and manifest.');
          NODE

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web

      - name: Verify live GitHub Pages app and Flutter assets
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const origin = "https://riobase.github.io/sana/";
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          let response;
          let html = "";
          for (let attempt = 1; attempt <= 12; attempt += 1) {
            try {
              response = await fetch(origin, {
                headers: { "Cache-Control": "no-cache" },
                signal: AbortSignal.timeout(15000)
              });
              if (response.ok) {
                html = await response.text();
                if (html.includes('<base href="/sana/">') && html.includes("<title>Sana</title>")) break;
              }
            } catch (error) {
              console.log(`Pages not ready yet (attempt ${attempt}): ${error.message}`);
            }
            if (attempt < 12) await sleep(10000);
          }

          if (!response?.ok || !html.includes('<base href="/sana/">') || !html.includes("<title>Sana</title>")) {
            throw new Error(`Sana Pages did not serve the expected Flutter homepage (HTTP ${response?.status ?? "no response"}).`);
          }

          for (const asset of ["flutter_bootstrap.js", "main.dart.js", "manifest.json"]) {
            const assetResponse = await fetch(new URL(asset, origin), {
              method: "HEAD",
              headers: { "Cache-Control": "no-cache" },
              signal: AbortSignal.timeout(15000)
            });
            if (!assetResponse.ok) {
              throw new Error(`Sana Flutter asset failed to load: ${assetResponse.status} ${asset}`);
            }
            console.log(`Verified Sana asset: ${asset}`);
          }
          console.log("Sana live Pages homepage and Flutter assets passed.");
          NODE
